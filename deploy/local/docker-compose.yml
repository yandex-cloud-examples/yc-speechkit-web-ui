version: '3.8'

services:
  tts:
    build:
      context: ../../back/tts
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - API_SECRET=${API_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
    ports:
      - "8081:8080"
    networks:
      - speechkit-network

  stt:
    build:
      context: ../../back/stt
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - API_SECRET=${API_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
      - MODEL_URI=${MODEL_URI}
    ports:
      - "8082:8080"
    networks:
      - speechkit-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../front:/usr/share/nginx/html:ro
    depends_on:
      - tts
      - stt
    networks:
      - speechkit-network

networks:
  speechkit-network:
    driver: bridge
